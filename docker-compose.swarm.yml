# ──────────────────────────────────────────────────────────────────
# docker-compose.swarm.yml — EduZone (Production, Docker Swarm)
#
# Dipakai lewat `docker stack deploy`, BUKAN `docker compose up`.
# Berbeda dari docker-compose.yml (lokal):
# - Tidak ada "build:" — Swarm tidak build image di node, image harus
#   sudah di-push ke registry (Docker Hub / GHCR) dan di-pull dari sana.
#   GANTI "<REGISTRY>/eduzone:latest" di bawah dengan image asli kamu
#   setelah kamu push (lihat pembahasan push ke Docker Hub sebelumnya).
# - Tidak ada "env_file:" — tidak didukung docker stack deploy. Semua
#   variable ditulis eksplisit pakai ${VAR}, disubstitusi dari file
#   ".env" yang ada di folder yang sama saat kamu jalankan `docker
#   stack deploy -c docker-compose.swarm.yml eduzone`.
# - "eduzone_app" dan "eduzone_nginx" adalah container/service TERPISAH
#   (beda dari versi lokal yang cuma mount source code langsung) — nginx
#   nggak otomatis punya akses ke public/ milik app. Makanya ada volume
#   "eduzone_public" yang di-share, di-copy oleh eduzone_app tiap start
#   (pola sama persis kayak fix "lab_public" di Lab Management).
# ──────────────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-EduZone}
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  DEBUGBAR_ENABLED: "false"
  APP_URL: ${APP_URL}

  TELESCOPE_ENABLED: ${TELESCOPE_ENABLED:-false}
  TELESCOPE_PRUNE_HOURS: ${TELESCOPE_PRUNE_HOURS:-12}

  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-error}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-eduzone}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD}

  BROADCAST_CONNECTION: reverb
  CACHE_STORE: redis
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}

  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: 6379
  # Index 0/1 — beda dari Lab Management (2/3) biar nggak numpuk di Redis
  # yang sama. Kalau nambah project baru lagi yang share Redis ini,
  # lanjutin 4/5, dst.
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EduZone}

  REVERB_APP_ID: ${REVERB_APP_ID}
  REVERB_APP_KEY: ${REVERB_APP_KEY}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET}
  REVERB_HOST: eduzone_reverb
  REVERB_PORT: 8082
  REVERB_SCHEME: http

services:
  # ─── PHP-FPM Laravel App ────────────────────────────────────────
  eduzone_app:
    image: ${DOCKER_IMAGE:-<REGISTRY>/eduzone:latest}
    user: "0:0"
    entrypoint: [""]
    command: >
      sh -c "cp -r /var/www/html/public/. /shared-public/ &&
             chmod -R 755 /shared-public &&
             php artisan config:cache && php artisan route:cache &&
             php artisan view:cache && php artisan event:cache &&
             php-fpm"
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    volumes:
      - eduzone_storage:/var/www/html/storage
      - eduzone_public:/shared-public
    networks:
      - eduzone_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Queue Worker ────────────────────────────────────────────────
  eduzone_queue:
    image: ${DOCKER_IMAGE:-<REGISTRY>/eduzone:latest}
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    entrypoint: [""]
    command: php artisan horizon
    volumes:
      - eduzone_storage:/var/www/html/storage
    networks:
      - eduzone_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Scheduler ───────────────────────────────────────────────────
  eduzone_scheduler:
    image: ${DOCKER_IMAGE:-<REGISTRY>/eduzone:latest}
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    entrypoint: [""]
    command: >
      sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    volumes:
      - eduzone_storage:/var/www/html/storage
    networks:
      - eduzone_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Reverb WebSocket (pakai image app yang sama) ───────────────
  eduzone_reverb:
    image: ${DOCKER_IMAGE:-<REGISTRY>/eduzone:latest}
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    entrypoint: [""]
    command: php artisan reverb:start --host=0.0.0.0 --port=8082 --no-interaction
    networks:
      - eduzone_network
      - shared_network
    environment:
      <<: *app-env

  # ─── Nginx Web Server ────────────────────────────────────────────
  eduzone_nginx:
    image: nginx:1.27-alpine
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    ports:
      - target: 80
        published: ${NGINX_PORT:-8083}
        protocol: tcp
        mode: ingress
    volumes:
      - ./docker/nginx/default.swarm.conf:/etc/nginx/conf.d/default.conf:ro
      - eduzone_public:/var/www/html/public
    networks:
      - eduzone_network
      - shared_network
    depends_on:
      - eduzone_app
      - eduzone_reverb

volumes:
  eduzone_storage:
    name: eduzone_storage
    driver: local
    # NOTE: 'local' aman selama eduzone_app/queue/scheduler/reverb semua
    # di-constraint ke node worker YANG SAMA. Kalau nanti nambah worker
    # node lagi, ganti ke shared storage (NFS/Ceph) atau tambahkan node
    # label constraint yang spesifik — sama catatan seperti Lab Management.
  eduzone_public:
    name: eduzone_public
    driver: local
    # Di-share antara eduzone_app dan eduzone_nginx supaya nginx bisa
    # menemukan index.php dan asset public lainnya. eduzone_app meng-copy
    # isi public/ ke sini tiap kali container start (lihat command di atas).

networks:
  eduzone_network:
    name: eduzone_network
    driver: overlay
    attachable: true
  shared_network:
    name: shared_network
    driver: overlay
    attachable: true
    external: true
