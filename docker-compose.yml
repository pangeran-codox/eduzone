name: eduzone

services:
  # ============================================================
  # PHP-FPM — aplikasi Laravel utama
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_TARGET:-development}
    image: eduzone-app:${APP_TARGET:-development}
    container_name: eduzone_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - eduzone_vendor:/var/www/html/vendor
      - eduzone_node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

  # ============================================================
  # Vite dev server — hot reload untuk resources/js & resources/css
  # ============================================================
  vite:
    image: node:20-alpine
    container_name: eduzone_vite
    working_dir: /app
    # npm install (bukan npm ci) — dev container ini boleh toleran kalau
    # package.json berubah manual tanpa lockfile sinkron dulu. Untuk build
    # production, Dockerfile tetap pakai `npm ci --frozen-lockfile` (stage node-builder).
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${VITE_PORT:-5174}:5174"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - network

  # ============================================================
  # Nginx — reverse proxy ke php-fpm, serve asset public/
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: eduzone_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-8083}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network

  # ============================================================
  # Queue worker — Laravel Horizon
  # ============================================================
  queue:
    image: eduzone-app:${APP_TARGET:-development}
    container_name: eduzone_queue
    restart: unless-stopped
    depends_on:
      - app
    command: php artisan horizon
    volumes:
      - .:/var/www/html
      - eduzone_vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

  # ============================================================
  # Scheduler — loop php artisan schedule:run tiap 60 detik
  # ============================================================
  scheduler:
    image: eduzone-app:${APP_TARGET:-development}
    container_name: eduzone_scheduler
    restart: unless-stopped
    depends_on:
      - app
    command: >
      sh -c "while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"
    volumes:
      - .:/var/www/html
      - eduzone_vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    networks:
      - network

volumes:
  eduzone_vendor:
    name: eduzone_vendor
  eduzone_node_modules:
    name: eduzone_node_modules

networks:
  # Network shared dengan infrastructure (postgres, redis, reverb, nginx-proxy-manager, dst)
  # yang hidup terpisah di C:\opt\docker\infrastructure\ — network ini harus sudah ada
  # (dibuat oleh compose infrastructure), makanya external: true, bukan didefinisikan di sini.
  network:
    name: network
    external: true
