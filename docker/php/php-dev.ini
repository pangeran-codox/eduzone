; ================================
; PHP Config - Development
; ================================

; Error reporting - tampilkan semua error
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Memory & execution
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 50M
post_max_size = 50M

; OPcache - nonaktif di dev supaya perubahan langsung terdeteksi
opcache.enable = 0
opcache.enable_cli = 0
